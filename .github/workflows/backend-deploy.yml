name: Deploy backend

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      target_sha:
        description: Commit SHA to deploy; use this for a controlled rollback
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: production-backend
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Checkout exact target commit
        env:
          TARGET_SHA: ${{ inputs.target_sha || github.sha }}
        run: |
          set -euo pipefail
          printf '%s' "$TARGET_SHA" | grep -Eq '^[0-9a-fA-F]{40}$'
          git cat-file -e "$TARGET_SHA^{commit}"
          git checkout --detach "$TARGET_SHA"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate backend syntax
        run: python -m compileall -q backend

  deploy:
    needs: validate
    runs-on: ubuntu-latest
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_PORT: ${{ vars.VPS_PORT }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
      VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
      VPS_PROJECT_PATH: ${{ vars.VPS_PROJECT_PATH }}
      VPS_VENV_PATH: ${{ vars.VPS_VENV_PATH }}
      VPS_SYSTEMD_UNIT: ${{ vars.VPS_SYSTEMD_UNIT }}
    steps:
      - name: Check deployment configuration
        run: |
          set -euo pipefail
          for variable_name in \
            VPS_HOST VPS_PORT VPS_USER VPS_SSH_KEY VPS_KNOWN_HOSTS \
            VPS_PROJECT_PATH VPS_VENV_PATH VPS_SYSTEMD_UNIT; do
            if [ -z "${!variable_name:-}" ]; then
              echo "::error::Missing deployment configuration: $variable_name"
              exit 1
            fi
          done

      - name: Configure SSH
        run: |
          set -euo pipefail
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$VPS_SSH_KEY" > "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$VPS_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/id_ed25519" "$HOME/.ssh/known_hosts"

      - name: Deploy exact commit and restart service
        env:
          TARGET_SHA: ${{ inputs.target_sha || github.sha }}
        run: |
          set -euo pipefail
          ssh -p "$VPS_PORT" -i "$HOME/.ssh/id_ed25519" \
            -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
          "$VPS_USER@$VPS_HOST" bash -s -- \
            "$VPS_PROJECT_PATH" "$VPS_VENV_PATH" "$VPS_SYSTEMD_UNIT" "$TARGET_SHA" <<'REMOTE'
          set -Eeuo pipefail
          trap 'rc=$?; echo "::error::Remote deployment failed at line ${LINENO}: ${BASH_COMMAND} (exit ${rc})"; exit "$rc"' ERR

          project_path="$1"
          venv_path="$2"
          systemd_unit="$3"
          target_sha="$4"
          compile_cache="$(mktemp -d)"
          trap 'rm -rf -- "$compile_cache"' EXIT

          printf '%s' "$target_sha" | grep -Eq '^[0-9a-fA-F]{40}$'
          test -d "$project_path/.git"
          test -x "$venv_path/bin/python"
          git -C "$project_path" diff --quiet
          git -C "$project_path" diff --cached --quiet
          untracked_files="$(git -C "$project_path" ls-files --others --exclude-standard)"
          unexpected_untracked="$(printf '%s\n' "$untracked_files" | grep -vE '(^|/)__pycache__/.*$' || true)"
          if [ -n "$unexpected_untracked" ]; then
            printf 'Unexpected untracked files:\n%s\n' "$unexpected_untracked"
            exit 1
          fi
          git -C "$project_path" fetch --prune origin main
          git -C "$project_path" cat-file -e "$target_sha^{commit}"
          git -C "$project_path" checkout --detach "$target_sha"

          "$venv_path/bin/python" -m pip install -r "$project_path/backend/requirements.txt"
          PYTHONPYCACHEPREFIX="$compile_cache" "$venv_path/bin/python" -m compileall -q "$project_path/backend"
          systemctl restart "$systemd_unit"
          systemctl is-active --quiet "$systemd_unit"
          local_health="$(curl --fail --silent --show-error --max-time 20 http://127.0.0.1:8000/)"
          printf 'Local backend health: %s\n' "$local_health"
          deployed_sha="$(git -C "$project_path" rev-parse HEAD)"
          test "$deployed_sha" = "$target_sha"
          printf 'Deployed commit: %s\n' "$deployed_sha"
          REMOTE

      - name: Check public health endpoint
        run: |
          set -euo pipefail
          if curl --fail --silent --show-error --location \
            --retry 5 --retry-all-errors --retry-delay 3 --max-time 20 \
            --user-agent "IslandQuiz-Deploy-Healthcheck" \
            https://api.islandquiz.online/; then
            echo "Public Cloudflare health check passed."
          else
            echo "::warning::Public Cloudflare health check failed; local VPS backend gate passed and remains authoritative."
          fi
